name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  ci:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  tests:
    needs: [install]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # --changed diffs against the PR base with `git diff base...HEAD`
          # (merge-base, three-dot) — a shallow checkout has no shared
          # history to compute that from, so this needs full history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Test changed files only (pull requests)
        if: github.event_name == 'pull_request'
        run: >
          npm run test:unit:shard --
          --changed origin/${{ github.base_ref }}
          --shard=${{ matrix.shard }}/4
          --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Test full suite (push to main)
        if: github.event_name == 'push'
        run: >
          npm run test:unit:shard --
          --shard=${{ matrix.shard }}/4
          --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json

  unit-test-merge:
    needs: [tests]
    if: always()   # still merge even if a shard went red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports
      - run: npm run test:unit:merge
